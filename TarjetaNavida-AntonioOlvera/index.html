 <!DOCTYPE html>
 <!--Esta etiqueta define el tipo de documento como HTML-->
 <html lang="es">
<head>
    <!--El título de la página no es visible en el desarrollo pero es lo que funciona para el SEO-->
<title>Tarjeta de Navidad | Personalizados</title>
   <!--En la etiqueta head, va todo lo que no es visible en la página web pero la hace funcional-->
   <!--A continuación los metadatos para que la página reconozca, caracteres especiales, se adapte a diferentes dispositivos-->
  <meta charset="UTF-8"><!--Este metadato es para los caracteres especiales-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tarjeta de Navidad interactiva con diseño personalizado">
  <meta name="author" content="Antonio Olvera">

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

  <link rel="stylesheet" href="styles.css">

</head><!--HASTA AQUÍ VA EL HEAD-->

<body><!--Aquí inicia el body-->
    <div class="main-container">
   <!-- Cover -->
   <div class="page active" id="page-0">
    <div class="float-container">
     <img src="XMAS.jpg" alt="Avengers Christmas" class="cover-img">
    </div>
    <h1 class="cover-title">Merry Christmas 2026 ❤️</h1>
    <p class="cover-subtitle">Con todo mi cariño, ¡Feliz Navidad!</p>
    <button id="btn-enter" class="btn-primary">
      <span class="btn-text">Click </span>
    </button>
   </div>

   <!--Mensaje Página 1-->

  <div class="page" id="pagina1">
    <div class="photo-circle">
      <img class="photo-img" loading="lazy" src="rana.jpg" alt="Imagen de la rana rené navideña">
    </div>
    <p class="msg-text">Gracias por ser tan gran persona, 🎄espero pases una gran navidad 🎄</p>
    <button id="btn-next-1" class="btn-secondary">
      <span class="btn-text">Siguiente</span>
    </button>
   </div>

<!--Mensaje página 2-->

<div class="page" id="pagina2">
    <h2 class="gallery-title">Fotos de ti en Navidad ✨</h2>
    <div class="gallery-grid">
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="perritocool.jpg" alt="Perrito tomándose foto">
     </div>
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="perritomusica.jpg" alt="Perrito escuchando música">
     </div>
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="mono.jpg" alt="Mono selfie">
     </div>
    </div>
  
    <p class="gallery-caption">Así tú mi brrrother</p>
   </div>

<script src="script.js"></script>
</body>

 </html>
